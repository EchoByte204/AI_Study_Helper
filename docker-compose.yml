services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_tutor}
      POSTGRES_USER: ${POSTGRES_USER:-rag_tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-shared-environments}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag_tutor}:${POSTGRES_PASSWORD:-change-me-for-shared-environments}@db:5432/${POSTGRES_DB:-rag_tutor}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-256}
      EMBEDDING_WORKERS: ${EMBEDDING_WORKERS:-3}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      ENABLE_QUERY_REWRITE: ${ENABLE_QUERY_REWRITE:-true}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-180}
      TOP_K: ${TOP_K:-5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MEDIA_DIR: /app/media
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
